
---
apiVersion: v1
kind: Namespace
metadata:
  name: retail-store

---
# MySQL Database for Catalog Service
apiVersion: v1
kind: Service
metadata:
  name: catalog-mysql
  namespace: retail-store
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: catalog-mysql
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-mysql
  namespace: retail-store
spec:
  serviceName: catalog-mysql
  replicas: 1
  selector:
    matchLabels:
      app: catalog-mysql
  template:
    metadata:
      labels:
        app: catalog-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "my-secret-pw"
        - name: MYSQL_DATABASE
          value: "catalog"
        - name: MYSQL_USER
          value: "catalog_user"
        - name: MYSQL_PASSWORD
          value: "default_password"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# PostgreSQL Database for Orders Service
apiVersion: v1
kind: Service
metadata:
  name: orders-postgresql
  namespace: retail-store
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: orders-postgresql
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-postgresql
  namespace: retail-store
spec:
  serviceName: orders-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: orders-postgresql
  template:
    metadata:
      labels:
        app: orders-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "orders"
        - name: POSTGRES_USER
          value: "orders_user"
        ports:
        - containerPort: 5432
          name: postgresql
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# Redis for session management
apiVersion: v1
kind: Service
metadata:
  name: carts-redis
  namespace: retail-store
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: carts-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-redis
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts-redis
  template:
    metadata:
      labels:
        app: carts-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
# RabbitMQ for message queuing
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: retail-store
spec:
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  selector:
    app: rabbitmq

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management

---
# Catalog Service
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-store
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: catalog

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "catalog-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "catalog"
        - name: DB_USER
          value: "catalog_user"
        - name: DB_PASSWORD
          value: "default_password"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
