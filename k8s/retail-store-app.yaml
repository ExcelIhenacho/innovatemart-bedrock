---
# UI Service (Frontend)
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: retail-store
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: public.ecr.aws/aws-containers/retail-store-sample-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: CATALOG_HOST
          value: "catalog"
        - name: CATALOG_PORT
          value: "8080"
        - name: CARTS_HOST
          value: "carts"
        - name: CARTS_PORT
          value: "8080"
        - name: ORDERS_HOST
          value: "orders"
        - name: ORDERS_PORT
          value: "8080"
        - name: CHECKOUT_HOST
          value: "checkout"
        - name: CHECKOUT_PORT
          value: "8080"
        - name: ASSETS_HOST
          value: "assets"
        - name: ASSETS_PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

